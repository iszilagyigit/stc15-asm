
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>8x8 Matrix</title>
<style>
  body { font-family: sans-serif; }
  #matrix { display: grid; grid-template-columns: repeat(8, 32px); gap: 2px; }
  .cell { width: 32px; height: 32px; background: white; border: 1px solid #888; cursor: pointer; }
  .cell.on { background: black; }
  input { display: block; margin-top: 8px; width: 800px; font: 16px monospace; }
</style>
</head>
<body>

<div id="matrix"></div>

<label>Output HEX</label>
<input id="outputHex" readonly>

<label>Output BIN</label>
<input id="outputBin" readonly>

<script>
const matrix = document.getElementById("matrix");
const outputHex = document.getElementById("outputHex");
const outputBin = document.getElementById("outputBin");
const cells = [];

for (let r = 0; r < 8; r++) {
    cells[r] = [];
    for (let c = 0; c < 8; c++) {
        const cell = document.createElement("span");
        cell.className = "cell";
        cell.onclick = () => {
            cell.classList.toggle("on");
            update();
        };
        matrix.appendChild(cell);
        cells[r][c] = cell;
    }
}

function update() {
    const rows = cells.map(row =>
        row.map(cell => cell.classList.contains("on") ? "1" : "0").join("")
    );

    outputHex.value = rows.map(bin =>
        "#" + parseInt(bin, 2).toString(16).toUpperCase().padStart(2, "0") + "h"
    ).join(", ");

    outputBin.value = rows.map(bin => bin + "b").join(", ");
}

update();
</script>

</body>
</html>
